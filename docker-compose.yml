version: "3.9"

# ==========================================
# Soul of Médico AI — Docker Compose
# ==========================================
services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: som_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: soul_of_medico
    networks:
      - som_network

  # Node.js Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: som_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/soul_of_medico
      - PORT=5000
      - FRONTEND_URL=http://localhost:5173
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    networks:
      - som_network

  # React Frontend (served via nginx for production)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: som_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - som_network

volumes:
  mongodb_data:

networks:
  som_network:
    driver: bridge
